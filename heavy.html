<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Manuel Casimiro Carrasco | Desarrollador Web Urukais Klick | Diseñador">
    <link rel="icon" href="/rana.svg" type="image/x-icon">
    <title>MetalHead - Tu Música Heavy Metal</title>
    <link rel="stylesheet" href="/css/efecto.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #8B0000;
            --secondary: #1a1a1a;
            --accent: #B8860B;
            --text: #f0f0f0;
            --dark-bg: #0a0a0a;
            --card-bg: rgba(30, 30, 30, 0.8);
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, var(--secondary) 100%);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 2px solid var(--primary);
            margin-bottom: 30px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .logo i {
            font-size: 2.5rem;
            color: var(--primary);
        }
        
        .logo h1 {
            font-size: 2.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        
        .tagline {
            font-style: italic;
            opacity: 0.8;
            font-size: 1.1rem;
        }
        
        .search-container {
            display: flex;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }
        
        #searchInput {
            flex-grow: 1;
            padding: 12px 20px;
            border: 2px solid var(--primary);
            border-radius: 30px 0 0 30px;
            font-size: 1rem;
            outline: none;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text);
        }
        
        #searchInput::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }
        
        #searchButton {
            padding: 12px 25px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0 30px 30px 0;
            cursor: pointer;
            font-size: 1rem;
            transition: background 0.3s;
        }
        
        #searchButton:hover {
            background: #a00000;
        }
        
        .genres {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }
        
        .genre-btn {
            padding: 8px 15px;
            background: var(--card-bg);
            border: 1px solid var(--primary);
            border-radius: 20px;
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .genre-btn:hover, .genre-btn.active {
            background: var(--primary);
        }
        
        .results-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 100px;
        }
        
        .track-card {
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            border: 1px solid rgba(139, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .track-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(139, 0, 0, 0.3);
        }
        
        .album-art {
            width: 100%;
            border-radius: 5px;
            margin-bottom: 10px;
            aspect-ratio: 1/1;
            object-fit: cover;
        }
        
        .track-title {
            font-weight: bold;
            margin-bottom: 5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 1.1rem;
        }
        
        .track-artist {
            opacity: 0.8;
            font-size: 0.9rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--accent);
        }
        
        .track-duration {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 3px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }
        
        .player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(10, 10, 10, 0.95);
            padding: 15px;
            border-top: 2px solid var(--primary);
            backdrop-filter: blur(10px);
        }
        
        .player-controls {
            display: flex;
            align-items: center;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .now-playing {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }
        
        .now-playing-art {
            width: 60px;
            height: 60px;
            border-radius: 5px;
            margin-right: 15px;
            border: 1px solid var(--primary);
        }
        
        .now-playing-info {
            flex-grow: 1;
        }
        
        .now-playing-title {
            font-weight: bold;
            font-size: 1.1rem;
        }
        
        .now-playing-artist {
            opacity: 0.8;
            font-size: 0.9rem;
            color: var(--accent);
        }
        
        .control-buttons {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .control-button {
            background: none;
            border: none;
            color: var(--text);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }
        
        .control-button:hover {
            color: var(--primary);
            background: rgba(139, 0, 0, 0.2);
        }
        
        .play-button {
            font-size: 2rem;
            background: var(--primary);
            color: white;
        }
        
        .play-button:hover {
            background: #a00000;
            color: white;
        }
        
        .progress-container {
            flex-grow: 1;
            margin: 0 20px;
        }
        
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .progress {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.1s;
        }
        
        .time-info {
            display: flex;
            justify-content: space-between;
            margin-top: 5px;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        
        .volume-container {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: 20px;
        }
        
        .volume-slider {
            width: 80px;
        }
        
        .hidden {
            display: none;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2rem;
        }
        
        .loading i {
            font-size: 2rem;
            margin-bottom: 15px;
            color: var(--primary);
        }
        
        .featured-bands {
            margin-bottom: 30px;
        }
        
        .section-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            border-left: 4px solid var(--primary);
            padding-left: 10px;
        }
        
        .bands-container {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
        }
        
        .band-card {
            min-width: 150px;
            background: var(--card-bg);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(139, 0, 0, 0.3);
        }
        
        .band-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(139, 0, 0, 0.3);
        }
        
        .band-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary);
        }
        
        .band-name {
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            .results-container {
                grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            }
            
            .player-controls {
                flex-wrap: wrap;
            }
            
            .progress-container {
                order: 1;
                flex-basis: 100%;
                margin: 10px 0;
            }
            
            .control-buttons {
                margin: 0 auto;
            }
            
            header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <i class="fas fa-guitar"></i>
                <div>
                    <h1>Urukais Klick</h1>
                    <p class="tagline">Manuel Casimiro Carrasco</p>
                </div>
            </div>
            <div>
                    <h1>🐸</h1>
                </div>
        </header>
        
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Buscar bandas, canciones o álbumes de metal...">
            <button id="searchButton"><i class="fas fa-search"></i> Buscar</button>
        </div>
        
        <div class="featured-bands">
            <h2 class="section-title">Bandas Destacadas</h2>
            <div class="bands-container">
                <div class="band-card" data-band="Metallica">
                    <div class="band-icon"><i class="fas fa-skull"></i></div>
                    <div class="band-name">Metallica</div>
                </div>
                <div class="band-card" data-band="Iron Maiden">
                    <div class="band-icon"><i class="fas fa-ghost"></i></div>
                    <div class="band-name">Iron Maiden</div>
                </div>
                <div class="band-card" data-band="Black Sabbath">
                    <div class="band-icon"><i class="fas fa-cross"></i></div>
                    <div class="band-name">Black Sabbath</div>
                </div>
                <div class="band-card" data-band="Slayer">
                    <div class="band-icon"><i class="fas fa-fire"></i></div>
                    <div class="band-name">Slayer</div>
                </div>
                <div class="band-card" data-band="Megadeth">
                    <div class="band-icon"><i class="fas fa-bolt"></i></div>
                    <div class="band-name">Megadeth</div>
                </div>
                <div class="band-card" data-band="Judas Priest">
                    <div class="band-icon"><i class="fas fa-helicopter"></i></div>
                    <div class="band-name">Judas Priest</div>
                </div>
            </div>
        </div>
        
        <div class="genres">
            <button class="genre-btn active" data-genre="heavy metal">Heavy Metal</button>
            <button class="genre-btn" data-genre="thrash metal">Thrash Metal</button>
            <button class="genre-btn" data-genre="death metal">Death Metal</button>
            <button class="genre-btn" data-genre="black metal">Black Metal</button>
            <button class="genre-btn" data-genre="power metal">Power Metal</button>
            <button class="genre-btn" data-genre="doom metal">Doom Metal</button>
        </div>
        
        <div id="loadingMessage" class="loading hidden">
            <i class="fas fa-spinner fa-spin"></i>
            <p>Buscando riffs pesados...</p>
        </div>
        
        <div id="resultsContainer" class="results-container">
            <!-- Los resultados de búsqueda aparecerán aquí -->
        </div>
    </div>
    
    <div id="playerContainer" class="player-container hidden">
        <div class="player-controls">
            <div class="now-playing">
                <img id="nowPlayingArt" class="now-playing-art" src="" alt="Portada del álbum">
                <div class="now-playing-info">
                    <div id="nowPlayingTitle" class="now-playing-title">Selecciona una canción</div>
                    <div id="nowPlayingArtist" class="now-playing-artist"></div>
                </div>
            </div>
            
            <div class="control-buttons">
                <button id="shuffleButton" class="control-button"><i class="fas fa-random"></i></button>
                <button id="prevButton" class="control-button"><i class="fas fa-step-backward"></i></button>
                <button id="playButton" class="control-button play-button"><i class="fas fa-play"></i></button>
                <button id="nextButton" class="control-button"><i class="fas fa-step-forward"></i></button>
                <button id="repeatButton" class="control-button"><i class="fas fa-redo"></i></button>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar">
                    <div id="progress" class="progress"></div>
                </div>
                <div class="time-info">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>
            
            <div class="volume-container">
                <i class="fas fa-volume-up"></i>
                <input type="range" id="volumeControl" class="volume-slider" min="0" max="100" value="80">
            </div>
        </div>
    </div>

    <script>
        // Elementos DOM
        const searchInput = document.getElementById('searchInput');
        const searchButton = document.getElementById('searchButton');
        const resultsContainer = document.getElementById('resultsContainer');
        const loadingMessage = document.getElementById('loadingMessage');
        const playerContainer = document.getElementById('playerContainer');
        const nowPlayingArt = document.getElementById('nowPlayingArt');
        const nowPlayingTitle = document.getElementById('nowPlayingTitle');
        const nowPlayingArtist = document.getElementById('nowPlayingArtist');
        const playButton = document.getElementById('playButton');
        const prevButton = document.getElementById('prevButton');
        const nextButton = document.getElementById('nextButton');
        const shuffleButton = document.getElementById('shuffleButton');
        const repeatButton = document.getElementById('repeatButton');
        const progress = document.getElementById('progress');
        const progressBar = document.getElementById('progressBar');
        const currentTime = document.getElementById('currentTime');
        const duration = document.getElementById('duration');
        const volumeControl = document.getElementById('volumeControl');
        const genreButtons = document.querySelectorAll('.genre-btn');
        const bandCards = document.querySelectorAll('.band-card');

        // Variables de estado
        let currentAudio = null;
        let isPlaying = false;
        let currentTrackIndex = 0;
        let searchResults = [];
        let isShuffled = false;
        let isRepeating = false;

        // API de Deezer - no requiere clave para búsquedas básicas
        const DEEZER_API_BASE = 'https://corsproxy.io/?https://api.deezer.com';

        // Bandas de metal populares para búsquedas iniciales
        const metalBands = [
            "Metallica", "Iron Maiden", "Black Sabbath", "Slayer", "Megadeth", 
            "Judas Priest", "Pantera", "Death", "Opeth", "Gojira", 
            "Meshuggah", "Lamb of God", "System of a Down", "Slipknot", "Tool"
        ];

        // Buscar música
        async function searchMusic(query) {
            if (!query.trim()) return;
            
            loadingMessage.classList.remove('hidden');
            resultsContainer.innerHTML = '';
            
            try {
                // Añadir "metal" a la búsqueda para enfocar los resultados
                const searchQuery = query.toLowerCase().includes('metal') ? query : `${query} metal`;
                const response = await fetch(`${DEEZER_API_BASE}/search?q=${encodeURIComponent(searchQuery)}&limit=25`);
                const data = await response.json();
                
                searchResults = data.data || [];
                
                // Si no hay resultados, intentar una búsqueda más general
                if (searchResults.length === 0) {
                    const fallbackResponse = await fetch(`${DEEZER_API_BASE}/search?q=${encodeURIComponent(query)}&limit=25`);
                    const fallbackData = await fallbackResponse.json();
                    searchResults = fallbackData.data || [];
                }
                
                displayResults(searchResults);
            } catch (error) {
                console.error('Error buscando música:', error);
                resultsContainer.innerHTML = '<p>Error al buscar música. Intenta nuevamente.</p>';
            } finally {
                loadingMessage.classList.add('hidden');
            }
        }

        // Mostrar resultados
        function displayResults(tracks) {
            resultsContainer.innerHTML = '';
            
            if (tracks.length === 0) {
                resultsContainer.innerHTML = '<p>No se encontraron resultados. Intenta con otra búsqueda.</p>';
                return;
            }
            
            tracks.forEach((track, index) => {
                const trackCard = document.createElement('div');
                trackCard.className = 'track-card';
                
                // Calcular duración en formato mm:ss
                const minutes = Math.floor(track.duration / 60);
                const seconds = track.duration % 60;
                const durationText = `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
                
                trackCard.innerHTML = `
                    <img src="${track.album.cover_medium}" alt="${track.album.title}" class="album-art">
                    <div class="track-duration">${durationText}</div>
                    <div class="track-title">${track.title}</div>
                    <div class="track-artist">${track.artist.name}</div>
                `;
                
                trackCard.addEventListener('click', () => playTrack(track, index));
                resultsContainer.appendChild(trackCard);
            });
        }

        // Reproducir pista
        function playTrack(track, index) {
            // Detener reproducción actual si existe
            if (currentAudio) {
                currentAudio.pause();
            }
            
            // Actualizar interfaz
            nowPlayingArt.src = track.album.cover_medium;
            nowPlayingTitle.textContent = track.title;
            nowPlayingArtist.textContent = track.artist.name;
            playerContainer.classList.remove('hidden');
            
            // Actualizar estado
            currentTrackIndex = index;
            isPlaying = true;
            playButton.innerHTML = '<i class="fas fa-pause"></i>';
            
            // Reproducir preview (Deezer ofrece previews de 30 segundos)
            if (track.preview) {
                currentAudio = new Audio(track.preview);
                currentAudio.volume = volumeControl.value / 100;
                
                currentAudio.addEventListener('loadedmetadata', () => {
                    // Actualizar duración total
                    duration.textContent = formatTime(currentAudio.duration);
                    currentAudio.play();
                });
                
                currentAudio.addEventListener('timeupdate', updateProgress);
                
                currentAudio.addEventListener('ended', () => {
                    if (isRepeating) {
                        currentAudio.currentTime = 0;
                        currentAudio.play();
                    } else {
                        playNextTrack();
                    }
                });
                
                currentAudio.play().catch(error => {
                    console.error('Error reproduciendo audio:', error);
                });
            } else {
                alert('Esta canción no tiene vista previa disponible.');
            }
        }

        // Actualizar barra de progreso
        function updateProgress() {
            if (currentAudio) {
                const percent = (currentAudio.currentTime / currentAudio.duration) * 100;
                progress.style.width = `${percent}%`;
                currentTime.textContent = formatTime(currentAudio.currentTime);
            }
        }

        // Formatear tiempo (segundos a mm:ss)
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Reproducir siguiente pista
        function playNextTrack() {
            if (searchResults.length > 0) {
                let nextIndex;
                
                if (isShuffled) {
                    nextIndex = Math.floor(Math.random() * searchResults.length);
                } else {
                    nextIndex = (currentTrackIndex + 1) % searchResults.length;
                }
                
                playTrack(searchResults[nextIndex], nextIndex);
            }
        }

        // Reproducir pista anterior
        function playPrevTrack() {
            if (searchResults.length > 0) {
                let prevIndex;
                
                if (isShuffled) {
                    prevIndex = Math.floor(Math.random() * searchResults.length);
                } else {
                    prevIndex = (currentTrackIndex - 1 + searchResults.length) % searchResults.length;
                }
                
                playTrack(searchResults[prevIndex], prevIndex);
            }
        }

        // Controlar volumen
        volumeControl.addEventListener('input', () => {
            if (currentAudio) {
                currentAudio.volume = volumeControl.value / 100;
            }
        });

        // Event Listeners
        searchButton.addEventListener('click', () => {
            searchMusic(searchInput.value);
        });
        
        searchInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                searchMusic(searchInput.value);
            }
        });
        
        playButton.addEventListener('click', () => {
            if (currentAudio) {
                if (isPlaying) {
                    currentAudio.pause();
                    playButton.innerHTML = '<i class="fas fa-play"></i>';
                } else {
                    currentAudio.play();
                    playButton.innerHTML = '<i class="fas fa-pause"></i>';
                }
                isPlaying = !isPlaying;
            }
        });
        
        nextButton.addEventListener('click', playNextTrack);
        prevButton.addEventListener('click', playPrevTrack);
        
        shuffleButton.addEventListener('click', () => {
            isShuffled = !isShuffled;
            shuffleButton.style.color = isShuffled ? 'var(--primary)' : 'var(--text)';
        });
        
        repeatButton.addEventListener('click', () => {
            isRepeating = !isRepeating;
            repeatButton.style.color = isRepeating ? 'var(--primary)' : 'var(--text)';
        });
        
        // Barra de progreso clicable
        progressBar.addEventListener('click', (e) => {
            if (currentAudio) {
                const rect = progressBar.getBoundingClientRect();
                const percent = (e.clientX - rect.left) / rect.width;
                currentAudio.currentTime = percent * currentAudio.duration;
            }
        });
        
        // Botones de género
        genreButtons.forEach(button => {
            if (button.dataset.genre) {
                button.addEventListener('click', () => {
                    // Quitar clase active de todos los botones
                    genreButtons.forEach(btn => btn.classList.remove('active'));
                    // Añadir clase active al botón clickeado
                    button.classList.add('active');
                    // Buscar por género
                    searchMusic(button.dataset.genre);
                });
            }
        });
        
        // Tarjetas de bandas
        bandCards.forEach(card => {
            card.addEventListener('click', () => {
                searchMusic(card.dataset.band);
            });
        });

        // Inicializar con una búsqueda por defecto
        window.addEventListener('load', () => {
            // Seleccionar una banda aleatoria para la búsqueda inicial
            const randomBand = metalBands[Math.floor(Math.random() * metalBands.length)];
            searchMusic(randomBand);
        });
    </script>
</body>
</html>
